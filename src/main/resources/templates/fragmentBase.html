<!DOCTYPE html>
<html class="light" lang="en"  th:fragment="parent(content,title,script)"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Base page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" data-th-href="@{'/css/output.css'}">
    <link rel="stylesheet" data-th-href="@{'/css/style.css'}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
     integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" 
     crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="dark:bg-gray-900 bg-gray-100 dark:text-white">

     <!--common Header-->

    
           <!-- navbar-->
            <!-- if user logged in show user navbar -->
            <div th:if="${loggedInUser}">
                <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
            </div>

            <!-- if user not logged in show normal sidebar -->
            <div th:unless="${loggedInUser}">
                <div data-th-replace= "~{navbar::navbar}"> </div>
            </div>

          





    <!--Main content-->
    <div class="p-4">
    <section data-th-replace="${content}"></section>
</div>
 
</div>

    <!--common footer-->
 <footer class="p-4">
    <!-- Footer : Thank you -->
 </footer>

    <!--flow bite js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
<!-- sweet Alert js -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

      <!--common js page-->
      <script data-th-src="@{'/js/script.js'}"></script>
          <!--change script-->
   <th:block data-th-replace="${script}"></th:block>


   

</body>
</html>
