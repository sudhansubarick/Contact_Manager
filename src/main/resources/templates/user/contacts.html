<!DOCTYPE html>
<html lang="en" th:replace = "~{fragmentBase::parent(~{::#content},~{::title},~{::script})}">
<head>
   <title>All Your Contacts</title>
</head>


<body>

    <div  id="content">
          <!--  sidebar -->
          <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar::sideBar}"></div>
    </div>



    <div class="sm:pl-64 pt-20">
        <div class="" >
        <h1 class="text-5xl text-center">Your Contacts</h1>


        <div class="contacts_container p-5">
            <div class="flex justify-between items-center px-4 bg-white dark:bg-gray-900">
                <form
               data-th-object="${contactSearchForm}"
               data-th-action="@{'/user/contacts/search'}">

                <div class="flex p-5 items-center space-x-3 flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 pb-4 ">

                    <!-- select Box -->
                    <div>
                    <select
                    data-th-field="*{field}"

                    id="countries_disabled" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <option selected value="">Select Field</option>
                        <option value="name">Name</option>
                        <option value="phone">Phone</option>
                        <option value="email">Email</option>

                      </select>
                    </div>
                        <!-- search menu -->

                    <label for="table-search" class="sr-only">Search</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                            </svg>
                        </div>
                        <input
                        data-th-field="*{value}"

                        type="text" id="table-search-users" class="block p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search for users">
                    </div>
                    <button
                    type="submit"
                    class=" text-white px-3 py-2 bg-green-700 hover:bg-green-800  rounded-2xl dark:bg-blue-600 dark:hover:bg-blue-700">
                     Search</button>
                </div>
               </form>
              <div>
                <button
                type="button"
                onclick="exportData()"
                class=" text-white px-3 py-2 bg-green-700 hover:bg-green-800  rounded-2xl dark:bg-blue-600 dark:hover:bg-blue-700">
                 Export</button>
              </div>
               </div>

            <div class="relative  overflow-x-auto shadow-md sm:rounded-lg">
                <div data-th-replace="~{message :: messageBox}"> </div>
               


               <!-- Tables -->
                <table
                id="contact_table"
                data-th-if="${pageContact.totalElements>0}"
                class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                        <tr>

                            <th scope="col" class="px-6 py-3">
                                Name
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Phone
                            </th>
                            <th scope="col" class="px-6 py-3">
                              links
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr
                        data-th-object="${c}"
                        data-th-each="c : ${pageContact.getContent()}"
                        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">

                            <th scope="row" class="flex items-center px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white">
                                <img https
                                onerror="this.src='https://static.vecteezy.com/system/resources/thumbnails/020/765/399/small/default-profile-account-unknown-icon-black-silhouette-free-vector.jpg'"
                                class="w-10 h-10 rounded-full"
                                    data-th-src="@{*{picture}}"
                                src="/docs/images/people/profile-picture-1.jpg" alt="Jese image">
                                <div class="ps-3">
                                    <div class="text-base font-semibold" data-th-text="*{name}">Neil Sims</div>
                                    <div class="font-normal text-gray-500"  data-th-text="*{email}">neil.sims@flowbite.com</div>
                                </div>
                            </th>
                            <td class="px-6 py-4 " >
                                <i class="fa-solid fa-phone w-4 h-4"></i>
                               <span class="text-black dark:text-white"
                                    data-th-text="*{phoneNumber}"></span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center">

                                    <div data-th-if="*{favorite}" >
                                        <i class="fa-solid fa-star w-6 h-6 "></i>
                                    </div>


                                    <a data-th-href="@{*{websiteLink}}"  target="_blank" >
                                        <i class="fa-solid fa-earth-americas w-6 h-6"></i>
                                    </a>
                                    <a data-th-href="@{*{linkedInLink}}"  target="_blank" >
                                        <i class="fa-brands fa-linkedin  w-6 h-6"></i>
                                    </a>

                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div>
                                    <!-- <a data-th-href="@{'/user/contacts/delete/'+*{id}}"
                                    ><i class="fa-solid fa-trash"></i></a> -->

                                    <!-- delete contact -->
                                    <button th:onclick="deleteContact([[${c.id}]])"
                                    ><i class="fa-solid fa-trash"></i>
                                    </button>

                                    <!-- update contact -->
                                    <a data-th-href="@{'/user/contacts/view/'+*{id}}"
                                     class="p-1"><i class="fa-solid fa-pen"></i></a>

                                    <!-- fetch the id of the contact throught the pagecontact object c -->
                                   <!-- view contact -->
                                    <button
                                    th:onclick="loadContactdata([[${c.id}]])"
                                    ><i class="fa-solid fa-eye"></i></button>
                                </div>
                            </td>
                        </tr>

                    </tbody>
                </table>

                <!-- pagination component -->
                <div
                data-th-if="${pageContact.totalElements>0}"
                class="contact_container p-5 text-center">
                    <nav aria-label="Page navigation example">
                        <ul class="inline-flex -space-x-px text-base h-10">
                            <li data-th-unless="${pageContact.first}">
                              <a
                                data-th-href="@{'/user/contacts?size='+${pageSize}+'&page=' + ${pageContact.number-1}}"
                                href="#"
                                class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-gray-500 bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                                >Previous</a
                              >
                            </li>
                            <li
                              data-th-each="index :  ${#numbers.sequence(0,pageContact.totalPages-1)}"
                            >
                              <a
                                data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${index}}"
                                href="#"
                                data-th-classappend="${index==pageContact.number? 'bg-blue-50  dark:bg-gray-600' : 'bg-white dark:bg-gray-800'}"
                                class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                              >
                                <span data-th-text="${index+1}"></span>
                              </a>
                            </li>

                            <li data-th-unless="${pageContact.last}">
                              <a
                                data-th-href="@{'/user/contacts?size='+${pageSize}+'&page=' + ${pageContact.number+1}}"
                                href="#"
                                class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                                >Next</a
                              >
                            </li>
                          </ul>
                      </nav>
                </div>
                <h1
                class="text-5xl text-center dark:bg-gray-800 dark:text-white bg-white p-4"
                data-th-if="${pageContact.totalElements<=0}"
              >
                No result found
              </h1>
            </div>
</div>
        </div>
        <div data-th-replace="~{user/contact_modals :: contact}"></div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@linways/table-to-excel@1.0.4/dist/tableToExcel.min.js"></script>

<script data-th-src="@{'/js/contacts.js'}"></script>

    <script>
       function exportData(){
        
        TableToExcel.convert(document.getElementById("contact_table"), {
  name: "contacts.xlsx",
  sheet: {
    name: "Sheet 1"
  }
});
       }
    </script>

</body>
</html>
