name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: scm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties <<EOF
          spring.application.name=scm2.0
          server.port=8080
          spring.datasource.url=jdbc:mysql://127.0.0.1:3306/scm?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=update
          spring.security.oauth2.client.registration.google.client-id=dummy
          spring.security.oauth2.client.registration.google.client-secret=dummy
          spring.security.oauth2.client.registration.google.scope=email,profile
          EOF

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload jar
        uses: actions/upload  -artifact@v4
        with:
          name: app-jar
          path: target/*.jar
